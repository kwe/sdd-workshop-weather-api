<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather Globe</title>
  <meta name="description" content="Interactive 3D globe showing current weather and 5-day forecasts.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js" integrity="sha384-1uolMBZ25k3zJcNwCLEv49+L+m2dZudqAzsoSAJfQTzDCSBxJzrMuZ2dkp/5JKiT" crossorigin="anonymous"></script>
  <script type="module" src="/static/js/main.js"></script>
</head>
<body>
  <div id="app">
    <div id="globe" role="img" aria-label="Interactive 3D globe showing current weather by city"></div>

    <aside class="sidebar" aria-label="Cities">
      <header class="sidebar-head">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>Weather Globe</h1>
        </div>
        <div class="head-tools">
          <span class="status-chip" id="status-chip" hidden></span>
          <div class="unit-toggle" role="group" aria-label="Temperature unit">
            <button type="button" data-unit="C" aria-pressed="true">°C</button>
            <button type="button" data-unit="F" aria-pressed="false">°F</button>
          </div>
        </div>
      </header>
      <div class="search">
        <input id="search" type="search" maxlength="60" placeholder="Search cities  ( / )" aria-label="Search cities" autocomplete="off" spellcheck="false">
      </div>
      <section class="favourites" id="favourites" aria-labelledby="favourites-title" hidden>
        <h2 id="favourites-title">Favourites</h2>
        <ul class="favourite-list" id="favourite-list"></ul>
      </section>
      <ul class="city-list" id="city-list"></ul>
    </aside>

    <aside class="detail" id="detail" role="complementary" aria-labelledby="detail-title" hidden>
      <header class="detail-head">
        <div>
          <h2 id="detail-title"></h2>
          <p class="detail-sub" id="detail-sub"></p>
        </div>
        <button type="button" class="fav-toggle" id="fav-toggle" aria-pressed="false" aria-label="Add to favourites" hidden><span aria-hidden="true">☆</span></button>
        <button type="button" class="close" id="detail-close" aria-label="Close details">✕</button>
      </header>
      <p class="note" id="detail-note" hidden></p>
      <section class="current" id="current"></section>
      <section class="city-alerts" id="city-alerts" aria-label="Active weather alerts" hidden></section>
      <section class="forecast" aria-label="5-day forecast">
        <h3>5-day forecast</h3>
        <div class="forecast-body" id="forecast-body"></div>
      </section>
    </aside>

    <div class="legend" aria-hidden="true">
      <div class="legend-bar" id="legend-bar"></div>
      <div class="legend-labels" id="legend-labels"></div>
    </div>

    <div class="alerts-banner" id="alerts-banner" hidden></div>
    <button type="button" class="reset-view" id="reset-view" aria-label="Reset view">⟲ Reset view</button>
    <button type="button" class="list-toggle" id="list-toggle" aria-label="Toggle city list" aria-expanded="false">☰</button>

    <div class="banner" id="banner" role="status" hidden></div>
    <div class="veil" id="veil" aria-hidden="true">
      <div class="veil-orb"></div>
      <p>Loading the world…</p>
    </div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <noscript><p class="banner">This page needs JavaScript. The JSON API is available at /api/weather.</p></noscript>
  </div>
</body>
</html>
